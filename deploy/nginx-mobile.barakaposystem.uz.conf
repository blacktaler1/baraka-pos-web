# Baraka POS mobil web — alohida sayt, boshqa loyihalarga tegmaydi.
# Statik fayllar: /var/www/baraka-pos-web/current
# /api/ so'rovlari mavjud backendga (127.0.0.1:8010) uzatiladi (bir xil domen => CORS kerak emas).

server {
    listen 80;
    listen [::]:80;
    server_name mobile.barakaposystem.uz;

    root /var/www/baraka-pos-web/current;
    index index.html;

    # sqlite3.wasm to'g'ri MIME bilan berilishi shart
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location /api/ {
        # Mavjud backend konteyneri (baraka_web) — u o'zgartirilmaydi
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host api.barakaposystem.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # Yangi versiya darhol yetib borishi uchun bular keshlanmaydi
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Har safar ETag bilan tekshiriladi: yangi versiya darhol yetib boradi,
    # o'zgarmagan fayl qayta yuklanmaydi (304)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
