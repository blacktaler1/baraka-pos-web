<!DOCTYPE html>
<html lang="uz">
<head>
  <!--
    Ilova domen ildizida emas, masalan /pos/ ostida joylashsa:
    flutter build web --base-href /pos/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Baraka POS — savdo nuqtasi tizimi (mobil versiya)">
  <meta name="theme-color" content="#145C45">

  <!-- Telefon ekraniga "ilova" sifatida qo'shish (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baraka POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Baraka POS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #145C45; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #1E8A66, #0B3D2E);
      transition: opacity .3s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .bar {
      position: absolute; bottom: 22%; width: 120px; height: 3px; border-radius: 3px;
      background: rgba(255,255,255,.18); overflow: hidden;
    }
    #splash .bar::after {
      content: ""; position: absolute; left: -40%; width: 40%; height: 100%;
      background: #fff; border-radius: 3px; animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { to { left: 100%; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Baraka POS">
    <div class="bar"></div>
  </div>
  <script>
    // Flutter birinchi kadrni chizgach yuklanish ekranini olib tashlaymiz
    function hideSplash() {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      s.style.pointerEvents = 'none';
      setTimeout(function () { s.remove(); }, 300);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    // Zaxira: hodisa kelmasa ham, Flutter ko'rinishi paydo bo'lgach yopamiz
    var obs = new MutationObserver(function () {
      if (document.querySelector('flutter-view')) { obs.disconnect(); setTimeout(hideSplash, 4000); }
    });
    obs.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
